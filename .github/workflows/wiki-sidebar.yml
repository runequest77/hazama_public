name: Wiki Sidebar Auto-Gen

on:
  # Wikiのページ作成/更新で発火
  gollum:
  # スクリプトやこのワークフローを更新したときにも発火（任意）
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/wiki-sidebar.yml"
      - "scripts/generate_sidebar.py"
  # 手動実行（任意）
  workflow_dispatch:

jobs:
  build:
    # 生成コミットで無限ループしないためのガード
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone wiki repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate folder indexes
        run: |
          python scripts/gen_folder_indexes.py --root wiki

      - name: Generate _Sidebar.md
        run: |
          python scripts/generate_sidebar.py \
            --root wiki \
            --output wiki/_Sidebar.md

      - name: Debug wiki tree after generation
        run: |
          echo "---- git status ----"
          git -C wiki status
          echo "---- tree ----"
          find wiki -maxdepth 2 -type f -name "_Sidebar.md" -print -exec wc -l {} \;
          echo "---- diff ----"
          git -C wiki diff -- _Sidebar.md || true

      - name: Commit & push if changed
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # untracked files (_Sidebar.md 新規作成など) を含めて差分確認
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(wiki): auto-update _Sidebar.md"
            git push origin HEAD
          else
            echo "No changes to commit."
          fi

      - name: Upload sidebar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-md
          path: wiki/_Sidebar.md
          if-no-files-found: warn
